site_name: Garmin GPS Map Update
site_description: Complete documentation for Garmin GPS map updates, Garmin Express, installation, and troubleshooting.
site_author: Garmin GPS Map Update Guide

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Garmin GPS Map Update: garmin-gps-map-update.md
  - Garmin Express: garmin-express.md
  - Map Installation: map-installation.md
  - Update Problems: update-problems.md
  - FAQ: faq.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences